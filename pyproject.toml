[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "quantum-computing-communication-workbench"
dynamic = ["version"]
description = "A local-first educational quantum circuit workbench with inspectable state evolution."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "Quantum Computing & Communication Workbench Contributors" }]
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
qiskit = ["qiskit>=2.5,<2.7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
qworkbench = "quantum_workbench.cli:main"

[tool.hatch.version]
path = "src/quantum_workbench/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
